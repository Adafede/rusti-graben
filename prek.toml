# Configuration file for `prek` - git hook framework
# Hooks must only call `./mk <task>` per rusti-graben conventions

default_stages = ["pre-commit"]
fail_fast = false

[[repos]]
repo = "local"
hooks = [
  { id = "cargo-fmt-check", name = "cargo-fmt-check", language = "system", entry = "./mk fmt", pass_filenames = false, always_run = true },
  { id = "cargo-clippy", name = "cargo-clippy", language = "system", entry = "./mk lint", pass_filenames = false, always_run = true },
  { id = "cargo-test", name = "cargo-test", language = "system", entry = "./mk test", pass_filenames = false, always_run = true },
]
