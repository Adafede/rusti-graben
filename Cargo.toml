[workspace]
resolver = "2"
members = [
  "crates/sample-bin",
  "crates/sample-lib",
]

[workspace.package]
version = "0.1.0"
authors = ["Rusti-Graben Maintainers"]
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/adafede/rusti-graben"
license = "AGPL-3.0-or-later"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "warn"
nursery = { level = "warn", priority = -1 }
panic = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[workspace.metadata.msrv]
rust-version = "1.85"
