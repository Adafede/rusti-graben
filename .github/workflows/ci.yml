name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ github.token }} # binstall rate limits

jobs:
  ci:
    name: ./mk ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # refquiem reads history; semver compares against the last tag
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup
        with:
          tier: ci

      - name: Run blocking gates
        run: ./mk ci

  selftest:
    name: ./mk selftest (every gate can fail)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # refquiem reads history; semver compares against the last tag
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup
        with:
          tier: all

      - name: Inject one violation per gate and assert failure
        run: ./mk selftest
