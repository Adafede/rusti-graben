name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ github.token }} # binstall rate limits

jobs:
  ci:
    name: ./mk ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # refquiem reads history; semver compares against the last tag
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-binstall
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-binstall@1.18.1

      - name: Install pinned tools (mk.versions)
        run: ./mk setup ci

      - name: Run blocking gates
        run: ./mk ci

  selftest:
    name: ./mk selftest (every gate can fail)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # refquiem reads history; semver compares against the last tag
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-binstall
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-binstall@1.18.1

      - name: Install pinned tools (mk.versions)
        run: ./mk setup all

      - name: Inject one violation per gate and assert failure
        run: ./mk selftest
