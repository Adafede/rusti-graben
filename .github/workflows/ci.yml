name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Run Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete,cargo-audit,typos-cli,cargo-hack,cargo-msrv,cargo-semver-checks
      - name: Install echoes/refquiem
        run: cargo install cargo-echoes cargo-refquiem 2>&1 | tail -1 || true
      - name: Install tombi
        run: cargo install tombi 2>&1 | tail -1 || true

      - name: Run Unified ./mk ci Gate
        run: ./mk ci

  ci-self-test:
    name: CI Self-Test (gate failure injection)
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete,cargo-audit,typos-cli,cargo-hack,cargo-msrv,cargo-semver-checks,tombi
      - name: Install echoes/refquiem if available
        run: cargo install cargo-echoes cargo-refquiem 2>&1 | tail -2 || true
      - name: Inject unformatted file violation and assert failure
        run: |
          echo "fn bad( ){let x=1;}" >> crates/sample-lib/src/lib.rs
          if ./mk ci; then echo "ERROR: ci did not fail on formatting violation"; git checkout -- crates/sample-lib/src/lib.rs; exit 1; else echo "OK: ci failed as expected"; git checkout -- crates/sample-lib/src/lib.rs; fi
