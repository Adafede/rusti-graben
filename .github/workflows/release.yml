name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GITHUB_TOKEN: ${{ github.token }} # binstall rate limits

jobs:
  release:
    name: ./mk ci-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # refquiem reads history; semver compares against the last tag
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup toolchain install

      # No cache here: release builds must not consume a cache other runs could have poisoned.
      - name: Install cargo-binstall
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-binstall@1.18.1

      - name: Install pinned tools (mk.versions)
        run: ./mk setup ci

      - name: Run release gates
        run: ./mk ci-release
